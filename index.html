<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動態支付寶代付與還款記帳系統 (雲端共編版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <!-- 引入 Babel 供瀏覽器即時編譯 JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- 引入 Recharts 圖表庫 -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <style>
        /* 自訂捲軸與試算表外觀 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 隱藏數字輸入框的上下箭頭，並強制手機端不自動放大 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number], input[type=text] { -moz-appearance: textfield; }

        /* 自訂 Checkbox 樣式，稍微放大觸控區 */
        .reconcile-checkbox { width: 1.5rem; height: 1.5rem; cursor: pointer; accent-color: #4F81BD; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-[100dvh] overflow-hidden flex flex-col w-full">
    <div id="root" class="flex-1 min-h-0 flex flex-col w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        function App() {
            // 雲端連線狀態
            const [dbRef, setDbRef] = useState(null);
            const [syncStatus, setSyncStatus] = useState(typeof __firebase_config === 'undefined' ? 'local' : 'offline');

            // 權限與彈窗狀態
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showDeleteRowModal, setShowDeleteRowModal] = useState(false);
            const [rowToDelete, setRowToDelete] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [pendingAction, setPendingAction] = useState(null);

            // 基礎資料狀態
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('joption_excel_settings');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (!parsed.adminPin) parsed.adminPin = '8888';
                    return parsed;
                }
                return { initialDebt: 400000, rateOrig: 4.7, ratePay: 5.0, adminPin: '8888' };
            });

            const [rows, setRows] = useState(() => {
                const saved = localStorage.getItem('joption_excel_rows');
                if (saved) {
                    const parsedData = JSON.parse(saved);
                    return parsedData.map(r => ({
                        ...r,
                        dateRMB: r.dateRMB !== undefined ? r.dateRMB : (r.date || ''),
                        dateTWD: r.dateTWD || '',
                        isReconciled: r.isReconciled || false
                    }));
                }
                return Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
            });

            // 初始化 Firebase
            useEffect(() => {
                if (typeof __firebase_config === 'undefined') return;

                const initFirebase = async () => {
                    try {
                        const loadModule = new Function('url', 'return import(url)');
                        const { initializeApp } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const { getFirestore, doc, setDoc, onSnapshot } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        onAuthStateChanged(auth, (user) => {
                            if (user) {
                                setDbRef({ db, doc, setDoc, onSnapshot, appId });
                            }
                        });
                    } catch (err) {
                        console.error("Firebase init error:", err);
                    }
                };
                initFirebase();
            }, []);

            // 監聽雲端資料
            useEffect(() => {
                if (!dbRef) return;

                setSyncStatus('connecting');
                const { db, doc, onSnapshot, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');

                const unsubscribe = onSnapshot(roomDoc, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.settings) setSettings(data.settings);
                        if (data.rows) setRows(data.rows);
                    } else {
                        saveToCloudRef.current(settings, rows);
                    }
                    setSyncStatus('online');
                }, (error) => {
                    console.error("Sync error:", error);
                    setSyncStatus('offline');
                });

                return () => unsubscribe();
            }, [dbRef]);

            // 儲存至雲端
            const saveToCloudRef = useRef(null);
            saveToCloudRef.current = async (newSettings, newRows) => {
                if (!dbRef) return;
                const { db, doc, setDoc, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');
                try {
                    await setDoc(roomDoc, { settings: newSettings, rows: newRows, updatedAt: Date.now() });
                } catch (e) {
                    console.error("Save error:", e);
                }
            };

            const updateRows = (newRows) => {
                setRows(newRows);
                localStorage.setItem('joption_excel_rows', JSON.stringify(newRows));
                if (syncStatus === 'online') saveToCloudRef.current(settings, newRows);
            };

            const updateSettings = (newSettings) => {
                setSettings(newSettings);
                localStorage.setItem('joption_excel_settings', JSON.stringify(newSettings));
                if (syncStatus === 'online') saveToCloudRef.current(newSettings, rows);
            };

            // 自動擴充列數
            useEffect(() => {
                const lastRow = rows[rows.length - 1];
                const secondLastRow = rows[rows.length - 2];
                if ((lastRow && (lastRow.purchaseRMB !== '' || lastRow.dateRMB !== '')) || 
                    (secondLastRow && (secondLastRow.purchaseRMB !== '' || secondLastRow.dateRMB !== ''))) {
                    const newRows = Array.from({ length: 5 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
                    updateRows([...rows, ...newRows]);
                }
            }, [rows]);

            // 權限檢查包裝函式
            const requireAdmin = (action) => {
                if (isAdmin) {
                    if (action) action();
                } else {
                    setPendingAction(() => action);
                    setShowAuthModal(true);
                }
            };

            const handleAuthSubmit = () => {
                if (pinInput === settings.adminPin) {
                    setIsAdmin(true);
                    setShowAuthModal(false);
                    setPinInput('');
                    setAuthError(false);
                    if (pendingAction) {
                        pendingAction();
                        setPendingAction(null);
                    }
                } else {
                    setAuthError(true);
                    setTimeout(() => setAuthError(false), 2000);
                }
            };

            // 操作處理函式
            const handleCellChange = (index, field, value) => {
                const newRows = [...rows];
                newRows[index][field] = value;
                updateRows(newRows);
            };

            const handleReconcileToggle = (index) => {
                requireAdmin(() => {
                    const newRows = [...rows];
                    newRows[index].isReconciled = !newRows[index].isReconciled;
                    updateRows(newRows);
                });
            };

            const handleClearAllRequest = () => {
                requireAdmin(() => {
                    setShowConfirmModal(true);
                });
            };

            const executeClearAll = () => {
                updateRows(Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false })));
                setShowConfirmModal(false);
            };

            const handleDeleteRowRequest = (index) => {
                requireAdmin(() => {
                    setRowToDelete(index);
                    setShowDeleteRowModal(true);
                });
            };

            const executeDeleteRow = () => {
                if (rowToDelete !== null) {
                    const newRows = [...rows];
                    newRows.splice(rowToDelete, 1);
                    if (newRows.length === 0) {
                        newRows.push({ id: Date.now(), dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false });
                    }
                    updateRows(newRows);
                    setShowDeleteRowModal(false);
                    setRowToDelete(null);
                }
            };

            const handleAddRows = () => {
                const newRows = Array.from({ length: 5 }, (_, i) => ({ 
                    id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false 
                }));
                updateRows([...rows, ...newRows]);
            };

            // 邏輯計算
            const margin = (settings.ratePay - settings.rateOrig).toFixed(2);
            let currentDebt = settings.initialDebt;
            let totalPurchaseRMB = 0;
            let totalRequiredTWD = 0;
            let totalRepaid = 0;

            const processedRows = rows.map((row, index) => {
                const purchase = parseFloat(row.purchaseRMB);
                if (!isNaN(purchase) && purchase > 0) {
                    const requiredTWD = purchase * settings.ratePay;
                    const principalPaid = purchase * margin;
                    currentDebt -= principalPaid;

                    totalPurchaseRMB += purchase;
                    totalRequiredTWD += requiredTWD;
                    totalRepaid += principalPaid;

                    return { ...row, batch: `第 ${index + 1} 期`, requiredTWD, principalPaid, remainingDebt: currentDebt, hasData: true };
                }
                return { ...row, batch: `第 ${index + 1} 期`, requiredTWD: null, principalPaid: null, remainingDebt: null, hasData: false };
            });

            const chartData = [
                { batch: '初始', debt: settings.initialDebt },
                ...processedRows.filter(r => r.hasData).map(r => ({ batch: r.batch, debt: Math.round(r.remainingDebt) }))
            ];

            // 遮罩小工具
            const renderMaskedNumber = (num, isShort = false) => {
                if (!isAdmin) return isShort ? '🔒 ***' : '🔒 ******';
                return Math.round(num).toLocaleString();
            };

            return (
                <div className="flex flex-col h-full p-2 md:p-5 max-w-[1400px] w-full mx-auto font-sans relative">
                    
                    {/* 1. 上方置頂區塊 (Header + 儀表板) */}
                    <div className="flex-none shrink-0 space-y-3 mb-3">
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200 gap-3 sm:gap-0">
                            <div className="w-full sm:w-auto">
                                <h1 className="text-xl md:text-2xl font-bold text-slate-800 tracking-tight flex items-center justify-between sm:justify-start">
                                    <span>代付對帳表</span>
                                    {syncStatus === 'online' && <span className="ml-2 px-2 py-1 bg-emerald-100 text-emerald-700 text-[10px] md:text-xs rounded-md border border-emerald-200 shadow-sm flex items-center whitespace-nowrap"><div className="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></div>已連線</span>}
                                    {syncStatus === 'connecting' && <span className="ml-2 px-2 py-1 bg-yellow-100 text-yellow-700 text-[10px] md:text-xs rounded-md border border-yellow-200 shadow-sm whitespace-nowrap">連線中...</span>}
                                    {syncStatus === 'offline' && <span className="ml-2 px-2 py-1 bg-slate-100 text-slate-600 text-[10px] md:text-xs rounded-md border border-slate-200 shadow-sm whitespace-nowrap">單機模式</span>}
                                </h1>
                                <p className="text-slate-500 text-xs md:text-sm mt-1 hidden sm:block">只要修改數字，雙方畫面會立刻在背景自動同步</p>
                            </div>
                            
                            <div className="flex w-full sm:w-auto gap-2 md:gap-4 bg-slate-50 p-2 rounded-lg border border-slate-200 justify-between sm:justify-start">
                                <div className="flex items-center text-xs md:text-sm cursor-pointer" onClick={() => !isAdmin && requireAdmin()}>
                                    <label className="font-bold text-slate-600 mr-1 md:mr-2 flex items-center cursor-pointer">
                                        原匯率{!isAdmin && <span className="ml-1 text-[10px]">🔒</span>}:
                                    </label>
                                    <input 
                                        type="number" step="0.1" value={settings.rateOrig} 
                                        readOnly={!isAdmin}
                                        onChange={(e) => updateSettings({...settings, rateOrig: Number(e.target.value)})} 
                                        className={`w-14 md:w-16 p-1 border rounded text-center outline-none transition-colors text-base md:text-sm ${isAdmin ? 'bg-white focus:border-blue-500 text-slate-800' : 'bg-slate-200 text-slate-400 cursor-pointer shadow-inner'}`} 
                                    />
                                </div>
                                <div className="flex items-center text-xs md:text-sm cursor-pointer" onClick={() => !isAdmin && requireAdmin()}>
                                    <label className="font-bold text-slate-600 mr-1 md:mr-2 flex items-center cursor-pointer">
                                        結算{!isAdmin && <span className="ml-1 text-[10px]">🔒</span>}:
                                    </label>
                                    <input 
                                        type="number" step="0.1" value={settings.ratePay} 
                                        readOnly={!isAdmin}
                                        onChange={(e) => updateSettings({...settings, ratePay: Number(e.target.value)})} 
                                        className={`w-14 md:w-16 p-1 border rounded text-center outline-none transition-colors text-base md:text-sm ${isAdmin ? 'bg-white focus:border-blue-500 text-slate-800' : 'bg-slate-200 text-slate-400 cursor-pointer shadow-inner'}`} 
                                    />
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-4">
                            <div className={`bg-slate-800 p-3 md:p-4 rounded-xl text-white shadow-md transition-all ${!isAdmin && 'cursor-pointer hover:bg-slate-700'}`} onClick={() => !isAdmin && requireAdmin()}>
                                <p className="text-[10px] md:text-xs font-medium text-slate-300 mb-0.5 md:mb-1 tracking-wider whitespace-nowrap">目前結存欠款</p>
                                <p className="text-lg md:text-2xl font-black">{renderMaskedNumber(currentDebt)}</p>
                            </div>
                            <div className={`bg-gradient-to-br from-emerald-500 to-teal-600 p-3 md:p-4 rounded-xl text-white shadow-md transition-all ${!isAdmin && 'cursor-pointer hover:opacity-90'}`} onClick={() => !isAdmin && requireAdmin()}>
                                <p className="text-[10px] md:text-xs font-medium text-emerald-100 mb-0.5 md:mb-1 tracking-wider whitespace-nowrap">累計抵扣本金</p>
                                <p className="text-lg md:text-2xl font-black">{renderMaskedNumber(totalRepaid)}</p>
                            </div>
                            <div className="bg-blue-600 p-3 md:p-4 rounded-xl text-white shadow-md transition-all">
                                <p className="text-[10px] md:text-xs font-medium text-blue-100 mb-0.5 md:mb-1 tracking-wider whitespace-nowrap">累計採購(RMB)</p>
                                <p className="text-lg md:text-2xl font-black">{Math.round(totalPurchaseRMB).toLocaleString()}</p>
                            </div>
                            <div className="bg-purple-600 p-3 md:p-4 rounded-xl text-white shadow-md transition-all">
                                <p className="text-[10px] md:text-xs font-medium text-purple-100 mb-0.5 md:mb-1 tracking-wider whitespace-nowrap">應請款總計</p>
                                <p className="text-lg md:text-2xl font-black">{Math.round(totalRequiredTWD).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    {/* 2. 主體滑動區塊 (圖表 + 表格) */}
                    <div className="flex-1 min-h-0 bg-white rounded-xl shadow-sm border border-slate-300 flex flex-col overflow-hidden">
                        
                        {/* 圖表：手機版隱藏以節省高度，非管理員則鎖定 */}
                        {chartData.length > 1 && (
                            <div className="flex-none shrink-0 w-full h-32 md:h-40 border-b border-slate-200 p-4 bg-slate-50/50 hidden md:block">
                                {isAdmin ? (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={chartData} margin={{ top: 5, right: 20, left: 10, bottom: 5 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis dataKey="batch" axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b'}} />
                                            <YAxis axisLine={false} tickLine={false} tick={{fontSize: 12, fill: '#64748b'}} width={80} domain={['auto', 'auto']} tickFormatter={(v) => `$${v.toLocaleString()}`} />
                                            <Tooltip formatter={(value) => [`$${value.toLocaleString()}`, '結存餘額']} />
                                            <Line type="stepAfter" dataKey="debt" name="剩餘欠款" stroke="#4F81BD" strokeWidth={3} dot={{ r: 4, fill: '#4F81BD', strokeWidth: 2, stroke: '#fff' }} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div 
                                        className="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-white/60 rounded-lg border border-slate-200 border-dashed cursor-pointer hover:bg-slate-100 transition-colors"
                                        onClick={() => requireAdmin()}
                                    >
                                        <span className="text-2xl mb-1">🔒</span>
                                        <span className="text-sm font-bold">解鎖後顯示債務走勢圖</span>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 獨立的表格滑動層 */}
                        <div className="flex-1 overflow-auto bg-slate-50/30">
                            <table className="w-full border-collapse text-center text-sm min-w-[850px] md:min-w-[900px]">
                                <thead className="sticky top-0 z-20 shadow-[0_2px_4px_rgba(0,0,0,0.05)] outline outline-1 outline-slate-300">
                                    <tr>
                                        <th colSpan="7" className="border-r border-b border-slate-300 p-2 bg-white">
                                            <div className="text-left pl-2 flex items-center space-x-3">
                                                <button onClick={handleClearAllRequest} className="px-3 py-1.5 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 rounded text-xs transition-colors border border-slate-200 font-medium shadow-sm whitespace-nowrap">
                                                    清空重置表格
                                                </button>
                                                <span className="text-xs text-slate-400 font-normal hidden md:inline">【管理員專屬】解鎖後即可修改設定、顯示機密數字與刪除紀錄。</span>
                                            </div>
                                        </th>
                                        <th className="border-x border-b border-slate-300 p-2 bg-white text-right font-bold text-slate-700 whitespace-nowrap">
                                            原欠款{!isAdmin && <span className="ml-1 text-[10px]">🔒</span>}
                                        </th>
                                        <th className="border-l border-b border-slate-300 p-0 bg-yellow-50">
                                            <input 
                                                type="number" 
                                                value={settings.initialDebt} 
                                                readOnly={!isAdmin}
                                                onClick={() => !isAdmin && requireAdmin()}
                                                onChange={(e) => updateSettings({...settings, initialDebt: Number(e.target.value)})}
                                                className={`w-full h-full p-2 text-center font-bold outline-none transition-colors text-base md:text-sm ${isAdmin ? 'bg-transparent focus:bg-yellow-100 text-slate-800' : 'bg-slate-200 text-slate-600 cursor-pointer shadow-inner'}`}
                                            />
                                        </th>
                                    </tr>
                                    <tr className="bg-[#4F81BD] text-white text-xs md:text-sm">
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[50px] w-[50px] bg-[#385D8A]">
                                            <div className="flex flex-col items-center justify-center cursor-pointer select-none" onClick={() => setIsAdmin(!isAdmin)} title="點擊切換鎖定狀態">
                                                對帳
                                                <span className="text-[10px] mt-0.5">{isAdmin ? '🔓' : '🔒'}</span>
                                            </div>
                                        </th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[60px]">筆數</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[100px]">使用 RMB</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[100px]">轉帳 TWD</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[120px]">採購(RMB)</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[140px]">支付(TWD @ {settings.ratePay})</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[140px]">抵扣(TWD{isAdmin ? ` @ ${margin}` : ' 🔒'})</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[140px]">剩餘欠款總額{isAdmin ? '' : ' 🔒'}</th>
                                        <th className="border border-[#385D8A] p-2 md:p-2.5 font-medium min-w-[50px] w-[50px] bg-[#385D8A]">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white">
                                    {processedRows.map((r, idx) => {
                                        const isRec = r.isReconciled;
                                        const trClass = isRec ? "bg-slate-200 text-slate-400" : "hover:bg-slate-50 transition-colors";
                                        const cellClass = "border border-slate-200 p-1 md:p-2";
                                        const dateRMBClass = isRec ? "bg-slate-200 text-slate-500" : "bg-blue-50/30 text-slate-700 focus:bg-white";
                                        const dateTWDClass = isRec ? "bg-slate-200 text-slate-500" : "bg-green-50/30 text-slate-700 focus:bg-white";
                                        const purchaseClass = isRec ? "bg-slate-200 text-slate-500" : "bg-blue-50/60 text-slate-800 font-bold focus:bg-white";
                                        const textBase = isRec ? "text-slate-400" : "text-slate-700";
                                        const textRed = isRec ? "text-slate-400" : "text-red-600 font-bold";

                                        return (
                                            <tr key={r.id} className={trClass}>
                                                <td className={`${cellClass} ${isRec ? 'bg-slate-300' : 'bg-slate-100'} cursor-pointer transition-colors`} onClick={() => handleReconcileToggle(idx)}>
                                                    <input type="checkbox" checked={r.isReconciled} onChange={() => handleReconcileToggle(idx)} onClick={(e) => e.stopPropagation()} className="reconcile-checkbox" />
                                                </td>
                                                <td className={`${cellClass} ${isRec ? '' : 'bg-slate-50/50 text-slate-600'} text-xs md:text-sm`}>{r.batch}</td>
                                                <td className="border border-slate-200 p-0">
                                                    <input type="text" placeholder="6/1" value={r.dateRMB} onChange={(e) => handleCellChange(idx, 'dateRMB', e.target.value)} className={`w-full h-full p-2 text-center outline-none focus:ring-2 focus:ring-inset focus:ring-blue-400 placeholder:text-slate-300 transition-colors text-base md:text-sm ${dateRMBClass}`} />
                                                </td>
                                                <td className="border border-slate-200 p-0">
                                                    <input type="text" placeholder="6/5" value={r.dateTWD} onChange={(e) => handleCellChange(idx, 'dateTWD', e.target.value)} className={`w-full h-full p-2 text-center outline-none focus:ring-2 focus:ring-inset focus:ring-green-400 placeholder:text-slate-300 transition-colors text-base md:text-sm ${dateTWDClass}`} />
                                                </td>
                                                <td className="border border-slate-200 p-0">
                                                    <input type="number" placeholder="輸入 RMB" value={r.purchaseRMB} onChange={(e) => handleCellChange(idx, 'purchaseRMB', e.target.value)} className={`w-full h-full p-2 text-center outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500 placeholder:text-blue-300/50 transition-colors text-base md:text-sm ${purchaseClass}`} />
                                                </td>
                                                <td className={`${cellClass} font-mono ${textBase} transition-colors text-sm`}>{r.hasData ? Math.round(r.requiredTWD).toLocaleString() : ''}</td>
                                                
                                                {/* 遮罩處理：抵扣金額 */}
                                                <td className={`${cellClass} font-mono ${textBase} transition-colors text-sm ${!isAdmin && 'cursor-pointer'}`} onClick={() => !isAdmin && requireAdmin()}>
                                                    {r.hasData ? renderMaskedNumber(r.principalPaid, true) : ''}
                                                </td>
                                                
                                                {/* 遮罩處理：剩餘欠款總額 */}
                                                <td className={`${cellClass} font-mono ${textRed} transition-colors text-sm ${!isAdmin && 'cursor-pointer'}`} onClick={() => !isAdmin && requireAdmin()}>
                                                    {r.hasData ? renderMaskedNumber(r.remainingDebt, true) : ''}
                                                </td>
                                                
                                                <td className={`${cellClass} text-center`}>
                                                    <button onClick={() => handleDeleteRowRequest(idx)} className="text-slate-400 hover:text-red-500 transition-colors p-2 rounded hover:bg-red-50 focus:outline-none touch-manipulation" title="刪除此筆紀錄">
                                                        <svg className="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        
                        {/* 3. 底部按鈕區：也固定在底部，不會被滑掉 */}
                        <div className="flex-none shrink-0 bg-slate-50 border-t border-slate-200 p-2 md:p-3 flex justify-center">
                            <button 
                                onClick={handleAddRows} 
                                className="px-6 py-2 md:py-2.5 bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 rounded-full font-bold text-xs md:text-sm transition-colors flex items-center shadow-sm active:bg-blue-200 touch-manipulation"
                            >
                                <svg className="w-4 h-4 md:w-5 md:h-5 mr-1 md:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                向下新增 5 期空白列
                            </button>
                        </div>
                    </div>

                    {/* 權限解鎖彈窗 */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all mx-4">
                                <div className="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center mb-4 mx-auto">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <h3 className="text-lg font-bold text-center text-slate-800 mb-2">機密解鎖</h3>
                                <p className="text-sm text-center text-slate-500 mb-4">此功能僅限管理者使用，請輸入密碼：</p>
                                <input 
                                    type="password" 
                                    inputMode="numeric"
                                    pattern="[0-9]*"
                                    value={pinInput} 
                                    onChange={(e)=>setPinInput(e.target.value)} 
                                    onKeyDown={(e) => { if(e.key === 'Enter') handleAuthSubmit(); }} 
                                    className={`w-full border-2 rounded-lg p-3 text-center text-2xl tracking-widest mb-2 outline-none transition-colors text-base md:text-2xl ${authError ? 'border-red-500 bg-red-50 text-red-700' : 'border-slate-200 focus:border-blue-500'}`}
                                    autoFocus 
                                />
                                {authError && <p className="text-xs text-red-500 text-center mb-2 font-bold animate-pulse">密碼錯誤，請重試！</p>}
                                {!authError && <div className="h-4 mb-2"></div>}
                                <div className="flex space-x-3">
                                    <button onClick={() => { setShowAuthModal(false); setPendingAction(null); setPinInput(''); setAuthError(false); }} className="flex-1 px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium transition-colors">取消</button>
                                    <button onClick={handleAuthSubmit} className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium transition-colors shadow-sm">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 清空重置確認彈窗 */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all mx-4">
                                <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-4 mx-auto">
                                    <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                </div>
                                <h3 className="text-lg font-bold text-center text-slate-800 mb-2">確定要清空所有紀錄嗎？</h3>
                                <p className="text-sm text-center text-slate-500 mb-6">清空後兩邊的畫面都會恢復為空白表格，且無法復原。</p>
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium transition-colors">取消</button>
                                    <button onClick={executeClearAll} className="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition-colors shadow-sm">確定清空</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 單筆刪除確認彈窗 */}
                    {showDeleteRowModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all mx-4">
                                <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-4 mx-auto">
                                    <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </div>
                                <h3 className="text-lg font-bold text-center text-slate-800 mb-2">確定要刪除這筆紀錄嗎？</h3>
                                <p className="text-sm text-center text-slate-500 mb-6">刪除後系統會自動重新計算後續所有的餘額，且無法復原。</p>
                                <div className="flex space-x-3">
                                    <button onClick={() => { setShowDeleteRowModal(false); setRowToDelete(null); }} className="flex-1 px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium transition-colors">取消</button>
                                    <button onClick={executeDeleteRow} className="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium transition-colors shadow-sm">確定刪除</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
