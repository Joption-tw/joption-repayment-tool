<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>代付對帳系統 (極簡縮排版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <!-- 引入 Babel 供瀏覽器即時編譯 JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- 引入 Recharts 圖表庫 -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <style>
        /* 自訂捲軸外觀 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        
        /* 隱藏數字輸入框的上下箭頭，並修正手機端字體防止自動放大 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number], input[type=text] { -moz-appearance: textfield; font-size: 14px !important; }

        /* 對帳勾選框大小 */
        .reconcile-checkbox { width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: #4F81BD; }
        
        /* 壓縮表格間距，增加可見行數 */
        td, th { padding: 4px 2px !important; height: 36px !important; }
        input { height: 30px !important; }
        
        /* 隱藏設定列的滾動條 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-[100dvh] overflow-hidden flex flex-col w-full">
    <div id="root" class="flex-1 min-h-0 flex flex-col w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        function App() {
            // 雲端連線狀態
            const [dbRef, setDbRef] = useState(null);
            const [syncStatus, setSyncStatus] = useState(typeof __firebase_config === 'undefined' ? 'local' : 'offline');
            
            // 管理員與彈窗狀態
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showDeleteRowModal, setShowDeleteRowModal] = useState(false);
            const [rowToDelete, setRowToDelete] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [pendingAction, setPendingAction] = useState(null);

            // 基礎設定資料
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('joption_excel_settings');
                return saved ? JSON.parse(saved) : { initialDebt: 400000, rateOrig: 4.7, ratePay: 5.0, adminPin: '8888' };
            });

            // 表格行資料
            const [rows, setRows] = useState(() => {
                const saved = localStorage.getItem('joption_excel_rows');
                if (saved) return JSON.parse(saved);
                return Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
            });

            // Firebase 初始化 (使用 new Function 繞過編譯器限制)
            useEffect(() => {
                if (typeof __firebase_config === 'undefined') return;
                const initFirebase = async () => {
                    try {
                        const loadModule = new Function('url', 'return import(url)');
                        const { initializeApp } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const { getFirestore, doc, setDoc, onSnapshot } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        
                        onAuthStateChanged(auth, (user) => {
                            if (user) setDbRef({ db, doc, setDoc, onSnapshot, appId });
                        });
                    } catch (err) { console.error("Firebase Init Error:", err); }
                };
                initFirebase();
            }, []);

            // 資料同步監聽
            useEffect(() => {
                if (!dbRef) return;
                setSyncStatus('connecting');
                const { db, doc, onSnapshot, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');
                
                const unsubscribe = onSnapshot(roomDoc, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.settings) setSettings(data.settings);
                        if (data.rows) setRows(data.rows);
                    } else {
                        saveToCloudRef.current(settings, rows);
                    }
                    setSyncStatus('online');
                }, (error) => { setSyncStatus('offline'); });
                return () => unsubscribe();
            }, [dbRef]);

            // 雲端儲存
            const saveToCloudRef = useRef(null);
            saveToCloudRef.current = async (newSettings, newRows) => {
                if (!dbRef) return;
                const { db, doc, setDoc, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');
                try {
                    await setDoc(roomDoc, { settings: newSettings, rows: newRows, updatedAt: Date.now() });
                } catch (e) { console.error("Cloud Save Error:", e); }
            };

            const updateRows = (newRows) => {
                setRows(newRows);
                localStorage.setItem('joption_excel_rows', JSON.stringify(newRows));
                if (syncStatus === 'online') saveToCloudRef.current(settings, newRows);
            };

            const updateSettings = (newSettings) => {
                setSettings(newSettings);
                localStorage.setItem('joption_excel_settings', JSON.stringify(newSettings));
                if (syncStatus === 'online') saveToCloudRef.current(newSettings, rows);
            };

            // 管理員驗證包裝
            const requireAdmin = (action) => {
                if (isAdmin) {
                    if (action) action();
                } else {
                    setPendingAction(() => action);
                    setShowAuthModal(true);
                }
            };

            const handleAuthSubmit = () => {
                if (pinInput === settings.adminPin) {
                    setIsAdmin(true);
                    setShowAuthModal(false);
                    setPinInput('');
                    setAuthError(false);
                    if (pendingAction) {
                        pendingAction();
                        setPendingAction(null);
                    }
                } else {
                    setAuthError(true);
                    setTimeout(() => setAuthError(false), 2000);
                }
            };

            // 操作方法
            const handleCellChange = (index, field, value) => {
                const newRows = [...rows];
                newRows[index][field] = value;
                updateRows(newRows);
            };

            const handleReconcileToggle = (index) => {
                requireAdmin(() => {
                    const newRows = [...rows];
                    newRows[index].isReconciled = !newRows[index].isReconciled;
                    updateRows(newRows);
                });
            };

            const handleClearAllRequest = () => {
                requireAdmin(() => {
                    setShowConfirmModal(true);
                });
            };

            const executeClearAll = () => {
                updateRows(Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false })));
                setShowConfirmModal(false);
            };

            const handleDeleteRowRequest = (index) => {
                requireAdmin(() => {
                    setRowToDelete(index);
                    setShowDeleteRowModal(true);
                });
            };

            const executeDeleteRow = () => {
                if (rowToDelete !== null) {
                    const newRows = [...rows];
                    newRows.splice(rowToDelete, 1);
                    if (newRows.length === 0) {
                        newRows.push({ id: Date.now(), dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false });
                    }
                    updateRows(newRows);
                    setShowDeleteRowModal(false);
                    setRowToDelete(null);
                }
            };

            const handleAddRows = () => {
                const newRows = Array.from({ length: 5 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
                updateRows([...rows, ...newRows]);
            };

            // 計算邏輯
            const margin = (settings.ratePay - settings.rateOrig).toFixed(2);
            let currentDebt = settings.initialDebt;
            let totalRMB = 0, totalTWD = 0, totalRepaid = 0;

            const processedRows = rows.map((row, index) => {
                const purchase = parseFloat(row.purchaseRMB);
                if (!isNaN(purchase) && purchase > 0) {
                    const reqTWD = purchase * settings.ratePay;
                    const principal = purchase * margin;
                    currentDebt -= principal;
                    totalRMB += purchase; totalTWD += reqTWD; totalRepaid += principal;
                    return { ...row, batch: index + 1, reqTWD, principal, balance: currentDebt, hasData: true };
                }
                return { ...row, batch: index + 1, hasData: false };
            });

            return (
                <div className="flex flex-col h-full p-1 max-w-[1400px] w-full mx-auto font-sans relative">
                    
                    {/* 上方設定與數據區塊 (約佔 1/5) */}
                    <div className="flex-none h-[20vh] min-h-[135px] flex flex-col justify-between mb-1">
                        {/* 標題與設定列 */}
                        <div className="bg-white p-1 rounded border flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-2 pl-1 shrink-0">
                                <span className="text-xs font-bold">對帳系統</span>
                                <span className={`text-[9px] px-1 rounded flex items-center gap-1 ${syncStatus==='online'?'bg-emerald-100 text-emerald-600':'bg-slate-100'}`}>
                                    {syncStatus==='online' && <div className="w-1 h-1 bg-emerald-500 rounded-full animate-pulse"></div>}
                                    {syncStatus==='online'?'即時':'連線中'}
                                </span>
                            </div>
                            <div className="flex gap-2 text-[10px] overflow-x-auto scrollbar-hide">
                                <div onClick={() => !isAdmin && requireAdmin()} className="flex items-center gap-1 cursor-pointer shrink-0 border-r pr-2 border-slate-100">
                                    <span className="text-slate-500">欠款{!isAdmin && '🔒'}:</span>
                                    <span className={`font-bold px-1 rounded ${isAdmin?'bg-yellow-50 text-blue-700':'text-slate-800'}`}>{settings.initialDebt.toLocaleString()}</span>
                                </div>
                                <div onClick={() => !isAdmin && requireAdmin()} className="flex items-center gap-1 cursor-pointer shrink-0 border-r pr-2 border-slate-100">
                                    <span className="text-slate-500">原匯{!isAdmin && '🔒'}:</span>
                                    <span className={`font-bold px-1 rounded ${isAdmin?'bg-blue-50 text-blue-700':'text-slate-800'}`}>{settings.rateOrig}</span>
                                </div>
                                <div onClick={() => !isAdmin && requireAdmin()} className="flex items-center gap-1 cursor-pointer shrink-0">
                                    <span className="text-slate-500">結算{!isAdmin && '🔒'}:</span>
                                    <span className={`font-bold px-1 rounded ${isAdmin?'bg-blue-50 text-blue-700':'text-blue-800'}`}>{settings.ratePay}</span>
                                </div>
                            </div>
                        </div>

                        {/* 四格數據方塊 */}
                        <div className="grid grid-cols-4 gap-1">
                            <div className="bg-slate-800 p-1 rounded text-white text-center flex flex-col justify-center shadow-sm">
                                <p className="text-[9px] opacity-70">餘額</p>
                                <p className="text-xs font-bold leading-tight">{Math.round(currentDebt).toLocaleString()}</p>
                            </div>
                            <div className="bg-emerald-600 p-1 rounded text-white text-center flex flex-col justify-center shadow-sm">
                                <p className="text-[9px] opacity-70">抵扣</p>
                                <p className="text-xs font-bold leading-tight">{Math.round(totalRepaid).toLocaleString()}</p>
                            </div>
                            <div className="bg-blue-600 p-1 rounded text-white text-center flex flex-col justify-center shadow-sm">
                                <p className="text-[9px] opacity-70">採購(RMB)</p>
                                <p className="text-xs font-bold leading-tight">{Math.round(totalRMB).toLocaleString()}</p>
                            </div>
                            <div className="bg-purple-600 p-1 rounded text-white text-center flex flex-col justify-center shadow-sm">
                                <p className="text-[9px] opacity-70">應收(TWD)</p>
                                <p className="text-xs font-bold leading-tight">{Math.round(totalTWD).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    {/* 表格主體區塊 (佔 4/5 空間) */}
                    <div className="flex-1 min-h-0 bg-white rounded border border-slate-300 flex flex-col overflow-hidden">
                        <div className="flex-1 overflow-auto bg-slate-50/20">
                            <table className="w-full border-collapse text-center text-[13px] min-w-[700px]">
                                <thead className="sticky top-0 z-20 shadow-sm">
                                    <tr className="bg-[#4F81BD] text-white text-[11px]">
                                        <th className="w-[36px] bg-[#385D8A]" onClick={()=>setIsAdmin(!isAdmin)}>{isAdmin?'🔓':'🔒'}</th>
                                        <th className="w-[30px]">No.</th>
                                        <th className="w-[75px]">RMB日</th>
                                        <th className="w-[75px]">TWD日</th>
                                        <th className="w-[95px]">採購(RMB)</th>
                                        <th className="w-[105px]">支付(TWD)</th>
                                        <th className="w-[105px]">抵扣</th>
                                        <th className="w-[115px]">剩餘欠款</th>
                                        <th className="w-[36px] bg-[#385D8A]">🗑</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white">
                                    {processedRows.map((r, idx) => {
                                        const isRec = r.isReconciled;
                                        const cellCls = `border border-slate-200 ${isRec ? 'bg-slate-50 text-slate-400' : ''}`;
                                        return (
                                            <tr key={r.id} className={isRec ? "opacity-70" : "hover:bg-blue-50/20"}>
                                                <td className={`${cellCls} cursor-pointer`} onClick={() => handleReconcileToggle(idx)}>
                                                    <input type="checkbox" checked={isRec} readOnly className="reconcile-checkbox align-middle" />
                                                </td>
                                                <td className={`${cellCls} text-[11px] text-slate-400`}>{r.batch}</td>
                                                <td className="border border-slate-200 p-0">
                                                    <input type="text" value={r.dateRMB} placeholder="6/1" onChange={(e)=>handleCellChange(idx,'dateRMB',e.target.value)} className={`w-full text-center outline-none bg-transparent ${isRec?'text-slate-400':'text-slate-700'}`} />
                                                </td>
                                                <td className="border border-slate-200 p-0">
                                                    <input type="text" value={r.dateTWD} placeholder="6/5" onChange={(e)=>handleCellChange(idx,'dateTWD',e.target.value)} className={`w-full text-center outline-none bg-transparent ${isRec?'text-slate-400':'text-slate-700'}`} />
                                                </td>
                                                <td className="border border-slate-200 p-0 bg-blue-50/10">
                                                    <input type="number" value={r.purchaseRMB} placeholder="0" onChange={(e)=>handleCellChange(idx,'purchaseRMB',e.target.value)} className={`w-full text-center outline-none font-bold bg-transparent ${isRec?'text-slate-400':'text-blue-900'}`} />
                                                </td>
                                                <td className={`${cellCls} font-mono font-bold text-slate-800`}>{r.hasData ? Math.round(r.reqTWD).toLocaleString() : ''}</td>
                                                <td className={`${cellCls} font-mono text-blue-600 text-[12px]`}>{r.hasData ? Math.round(r.principal).toLocaleString() : ''}</td>
                                                <td className={`${cellCls} font-mono font-bold text-red-600`}>{r.hasData ? Math.round(r.balance).toLocaleString() : ''}</td>
                                                <td className={cellCls}>
                                                    <button onClick={() => handleDeleteRowRequest(idx)} className="text-slate-300 hover:text-red-500 transition-colors p-1">
                                                        <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        
                        {/* 底部按鈕控制列 */}
                        <div className="flex-none bg-slate-100 p-1 flex justify-center gap-6 border-t border-slate-200">
                            <button onClick={handleClearAllRequest} className="text-[10px] text-red-500 font-bold px-4 py-1.5 border border-red-200 rounded-full bg-white active:bg-red-50 shadow-sm">清空重置</button>
                            <button onClick={handleAddRows} className="text-[10px] text-blue-700 font-bold px-4 py-1.5 border border-blue-200 rounded-full bg-blue-50 active:bg-blue-100 shadow-sm">+ 新增 5 期</button>
                        </div>
                    </div>

                    {/* 管理者密碼解鎖彈窗 */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-[280px] text-center border border-slate-200">
                                <h3 className="font-bold mb-4 text-slate-800">請輸入管理者密碼</h3>
                                <input type="password" inputMode="numeric" value={pinInput} onChange={(e)=>setPinInput(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&handleAuthSubmit()} className={`w-full border-2 rounded p-2 text-center text-xl tracking-widest outline-none mb-4 ${authError?'border-red-400 bg-red-50 text-red-700':'border-blue-500 focus:ring-2 focus:ring-blue-100'}`} autoFocus />
                                {authError && <p className="text-[10px] text-red-500 mb-2 font-bold animate-pulse">密碼錯誤，請重試！</p>}
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowAuthModal(false);setPinInput('');setAuthError(false);setPendingAction(null);}} className="flex-1 py-2 bg-slate-100 rounded text-sm text-slate-600">取消</button>
                                    <button onClick={handleAuthSubmit} className="flex-1 py-2 bg-blue-600 text-white rounded text-sm font-bold shadow-sm">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 刪除或重置確認彈窗 */}
                    {(showConfirmModal || showDeleteRowModal) && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-[1px]">
                            <div className="bg-white rounded-lg p-5 w-[260px] text-center shadow-xl border border-slate-100">
                                <p className="font-bold mb-5 text-sm text-slate-700 leading-relaxed">
                                    {showConfirmModal ? '確定要清空所有紀錄嗎？\n此動作無法還原。' : '確定要刪除這筆紀錄嗎？'}
                                </p>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowConfirmModal(false);setShowDeleteRowModal(false);}} className="flex-1 py-2 bg-slate-100 text-xs rounded text-slate-600">取消</button>
                                    <button onClick={showConfirmModal?executeClearAll:executeDeleteRow} className="flex-1 py-2 bg-red-600 text-white text-xs rounded font-bold shadow-sm">確定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
