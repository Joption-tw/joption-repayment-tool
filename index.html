<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>代付對帳系統 (雲端同步版)</title>
    <!-- Google Fonts - 思源黑體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- 引入 Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <style>
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number], input[type=text] { 
            -moz-appearance: textfield; 
            font-size: 14px !important; 
            padding: 0 2px !important;
        }

        .reconcile-checkbox { width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: #4F81BD; }
        td, th { padding: 4px 1px !important; height: 38px !important; }
        input { height: 30px !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- Firebase 配置 -->
    <script>
        window.__firebase_config = JSON.stringify({
            apiKey: "AIzaSyDuencR1lURki8FWWp0YAyQWEsYHOVMtpo",
            authDomain: "repayment-32260.firebaseapp.com",
            projectId: "repayment-32260",
            storageBucket: "repayment-32260.firebasestorage.app",
            messagingSenderId: "1037295279538",
            appId: "1:1037295279538:web:768b1cc95786807160d8ab"
        });
        window.__app_id = "joption-repayment-tool";
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-[100dvh] overflow-hidden flex flex-col w-full">
    <div id="root" class="flex-1 min-h-0 flex flex-col w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        function App() {
            // 雲端連線狀態
            const [dbRef, setDbRef] = useState(null);
            const [syncStatus, setSyncStatus] = useState(typeof __firebase_config === 'undefined' ? 'local' : 'offline');
            const [isInitialLoad, setIsInitialLoad] = useState(true);

            // 管理員與彈窗狀態
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showDeleteRowModal, setShowDeleteRowModal] = useState(false);
            const [showEditDebtModal, setShowEditDebtModal] = useState(false);
            const [editDebtInput, setEditDebtInput] = useState('');
            const [rowToDelete, setRowToDelete] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [pendingAction, setPendingAction] = useState(null);

            // 基礎設定與行資料
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('joption_excel_settings');
                return saved ? JSON.parse(saved) : { initialDebt: 187170, rateOrig: 4.7, ratePay: 5.0, adminPin: '8888' };
            });

            const [rows, setRows] = useState(() => {
                const saved = localStorage.getItem('joption_excel_rows');
                if (saved) return JSON.parse(saved);
                return Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
            });

            // Firebase 初始化
            useEffect(() => {
                if (typeof __firebase_config === 'undefined') return;
                const initFirebase = async () => {
                    try {
                        const loadModule = new Function('url', 'return import(url)');
                        const { initializeApp } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const { getFirestore, doc, setDoc, onSnapshot, getDoc } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        
                        const firebaseConfig = JSON.parse(__firebase_config);
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        
                        onAuthStateChanged(auth, (user) => {
                            if (user) setDbRef({ db, doc, setDoc, onSnapshot, getDoc, appId });
                        });
                    } catch (err) { console.error("Firebase Init Error:", err); }
                };
                initFirebase();
            }, []);

            // 資料同步監聽 (解決同步問題)
            useEffect(() => {
                if (!dbRef) return;
                setSyncStatus('connecting');
                const { db, doc, onSnapshot, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');
                
                const unsubscribe = onSnapshot(roomDoc, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.settings) {
                            setSettings(data.settings);
                            localStorage.setItem('joption_excel_settings', JSON.stringify(data.settings));
                        }
                        if (data.rows) {
                            setRows(data.rows);
                            localStorage.setItem('joption_excel_rows', JSON.stringify(data.rows));
                        }
                        setIsInitialLoad(false);
                    } else {
                        if (isInitialLoad) {
                            saveToCloud(settings, rows);
                            setIsInitialLoad(false);
                        }
                    }
                    setSyncStatus('online');
                }, (error) => { setSyncStatus('offline'); });
                return () => unsubscribe();
            }, [dbRef]);

            // 上傳雲端函式
            const saveToCloud = async (newSettings, newRows) => {
                if (!dbRef) return;
                const { db, doc, setDoc, appId } = dbRef;
                const roomDoc = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', 'shared_ledger');
                try {
                    await setDoc(roomDoc, { settings: newSettings, rows: newRows, updatedAt: Date.now() });
                } catch (e) { console.error("Cloud Save Error:", e); }
            };

            const updateRows = (newRows) => {
                setRows(newRows);
                localStorage.setItem('joption_excel_rows', JSON.stringify(newRows));
                if (syncStatus === 'online') saveToCloud(settings, newRows);
            };

            const updateSettings = (newSettings) => {
                setSettings(newSettings);
                localStorage.setItem('joption_excel_settings', JSON.stringify(newSettings));
                if (syncStatus === 'online') saveToCloud(newSettings, rows);
            };

            // 管理員驗證
            const requireAdmin = (action) => {
                if (isAdmin) { if (action) action(); } 
                else { setPendingAction(() => action); setShowAuthModal(true); }
            };

            const handleAuthSubmit = () => {
                if (pinInput === settings.adminPin) {
                    setIsAdmin(true); setShowAuthModal(false); setPinInput(''); setAuthError(false);
                    if (pendingAction) { pendingAction(); setPendingAction(null); }
                } else {
                    setAuthError(true); setTimeout(() => setAuthError(false), 2000);
                }
            };

            const handleEditDebtRequest = () => {
                setEditDebtInput(settings.initialDebt.toString());
                requireAdmin(() => { setShowEditDebtModal(true); });
            };

            const executeEditDebt = () => {
                const newDebt = parseInt(editDebtInput);
                if (!isNaN(newDebt) && newDebt > 0) {
                    updateSettings({...settings, initialDebt: newDebt});
                    setShowEditDebtModal(false);
                    setEditDebtInput('');
                }
            };

            // 操作方法
            const handleCellChange = (index, field, value) => {
                if (rows[index].isReconciled) return;
                const newRows = [...rows];
                newRows[index][field] = value;
                updateRows(newRows);
            };

            const handleReconcileToggle = (index) => {
                requireAdmin(() => {
                    const newRows = [...rows];
                    newRows[index].isReconciled = !newRows[index].isReconciled;
                    updateRows(newRows);
                });
            };

            const handleClearAllRequest = () => {
                requireAdmin(() => { setShowConfirmModal(true); });
            };

            const executeClearAll = () => {
                const newRows = Array.from({ length: 15 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
                updateRows(newRows);
                setShowConfirmModal(false);
            };

            const handleDeleteRowRequest = (index) => {
                requireAdmin(() => { setRowToDelete(index); setShowDeleteRowModal(true); });
            };

            const executeDeleteRow = () => {
                if (rowToDelete !== null) {
                    const newRows = [...rows];
                    newRows.splice(rowToDelete, 1);
                    if (newRows.length === 0) newRows.push({ id: Date.now(), dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false });
                    updateRows(newRows);
                    setShowDeleteRowModal(false);
                    setRowToDelete(null);
                }
            };

            const handleAddRows = () => {
                const newRows = Array.from({ length: 5 }, (_, i) => ({ id: Date.now() + i, dateRMB: '', dateTWD: '', purchaseRMB: '', isReconciled: false }));
                updateRows([...rows, ...newRows]);
            };

            const margin = (settings.ratePay - settings.rateOrig).toFixed(2);
            let currentDebt = settings.initialDebt;
            let totalRMB = 0, totalTWD = 0, totalRepaid = 0;

            const processedRows = rows.map((row, index) => {
                const purchase = parseFloat(row.purchaseRMB);
                if (!isNaN(purchase) && purchase > 0) {
                    const reqTWD = purchase * settings.ratePay;
                    const principal = purchase * margin;
                    currentDebt -= principal;
                    totalRMB += purchase; totalTWD += reqTWD; totalRepaid += principal;
                    return { ...row, batch: index + 1, reqTWD, principal, balance: currentDebt, hasData: true };
                }
                return { ...row, batch: index + 1, hasData: false };
            });

            return (
                <div className="flex flex-col h-full p-1 max-w-[1400px] w-full mx-auto font-sans relative">
                    
                    {/* 上方數據區塊 */}
                    <div className="flex-none flex flex-col gap-1 mb-1">
                        <div className="bg-white p-2 rounded border shadow-sm w-full">
                            <div className="flex justify-center items-center w-full mb-1.5">
                                <div className="flex items-center gap-2 shrink-0">
                                    <span className="text-lg md:text-2xl font-black text-blue-900" style={{fontFamily: "'Noto Sans TC', sans-serif"}}>家君網拍的對帳單</span>
                                    <span className={`text-[8px] md:text-[10px] px-1 md:px-1.5 rounded ${syncStatus==='online'?'bg-emerald-100 text-emerald-600':'bg-slate-100'}`}>{syncStatus==='online'?'● 同步中':'中斷'}</span>
                                </div>
                            </div>
                            <div className="flex gap-1.5 text-[8px] md:text-[9px] overflow-x-auto scrollbar-hide justify-center md:justify-end">
                                <div onClick={() => handleEditDebtRequest()} className="flex items-center gap-0.5 cursor-pointer shrink-0 border-r pr-1 border-slate-100">
                                    <span className="text-slate-400">欠款{!isAdmin && '🔒'}:</span>
                                    <span className={`font-bold ${isAdmin?'text-blue-600':'text-slate-800'}`}>{settings.initialDebt.toLocaleString()}</span>
                                </div>
                                <div onClick={() => requireAdmin()} className="flex items-center gap-0.5 cursor-pointer shrink-0 border-r pr-1 border-slate-100">
                                    <span className="text-slate-400">原匯{!isAdmin && '🔒'}:</span>
                                    <span className={`font-bold ${isAdmin?'text-blue-600':'text-slate-800'}`}>{settings.rateOrig}</span>
                                </div>
                                <div onClick={() => requireAdmin()} className="flex items-center gap-0.5 cursor-pointer shrink-0">
                                    <span className="text-slate-400">結算:</span>
                                    <span className="font-bold text-blue-700">{settings.ratePay}</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-4 gap-1">
                            <div className="bg-slate-800 p-1.5 rounded text-white text-center flex flex-col justify-center">
                                <p className="text-[8px] opacity-60">餘額</p>
                                <p className="text-[12px] font-black">{Math.round(currentDebt).toLocaleString()}</p>
                            </div>
                            <div className="bg-emerald-600 p-1.5 rounded text-white text-center flex flex-col justify-center">
                                <p className="text-[8px] opacity-60">抵扣</p>
                                <p className="text-[12px] font-black">{Math.round(totalRepaid).toLocaleString()}</p>
                            </div>
                            <div className="bg-blue-600 p-1.5 rounded text-white text-center flex flex-col justify-center">
                                <p className="text-[8px] opacity-60">採購(RMB)</p>
                                <p className="text-[12px] font-black">{Math.round(totalRMB).toLocaleString()}</p>
                            </div>
                            <div className="bg-purple-600 p-1.5 rounded text-white text-center flex flex-col justify-center">
                                <p className="text-[8px] opacity-60">應收TWD</p>
                                <p className="text-[12px] font-black">{Math.round(totalTWD).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    {/* 表格主體 */}
                    <div className="flex-1 min-h-0 bg-white rounded border border-slate-200 flex flex-col overflow-hidden">
                        <div className="flex-1 overflow-auto bg-slate-50/20">
                            <table className="w-full border-collapse text-center text-[12px] min-w-[390px]">
                                <thead className="sticky top-0 z-20 shadow-sm">
                                    <tr className="bg-[#4F81BD] text-white text-[10px]">
                                        <th className="w-[28px] bg-[#385D8A]" onClick={()=>setIsAdmin(!isAdmin)}>{isAdmin?'🔓':'🔒'}</th>
                                        <th className="w-[30px]">#</th>
                                        <th className="w-[48px]">使用</th>
                                        <th className="w-[48px]">轉帳</th>
                                        <th className="w-[64px]">人民幣</th>
                                        <th className="w-[68px]">台幣</th>
                                        <th className="w-[60px]">抵扣</th>
                                        <th className="w-[75px] bg-[#385D8A]">餘額</th>
                                        <th className="w-[28px] bg-[#385D8A]">🗑</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white">
                                    {processedRows.map((r, idx) => {
                                        const isRec = r.isReconciled;
                                        const cellCls = `border border-slate-100 ${isRec ? 'bg-slate-50 text-slate-300' : ''}`;
                                        
                                        return (
                                            <tr key={r.id} className={isRec ? "opacity-60" : "hover:bg-blue-50/10"}>
                                                <td className={`${cellCls} cursor-pointer`} onClick={() => handleReconcileToggle(idx)}>
                                                    <input type="checkbox" checked={isRec} readOnly className="reconcile-checkbox align-middle" />
                                                </td>
                                                
                                                {/* 筆數數字：字體調大 1.5 倍並加粗 */}
                                                <td className={`${cellCls} text-[14px] font-bold text-slate-400`}>{r.batch}</td>
                                                
                                                <td className="border border-slate-100 p-0">
                                                    <input
                                                        type="text" value={r.dateRMB} placeholder="5/1"
                                                        readOnly={isRec}
                                                        onChange={(e)=>handleCellChange(idx,'dateRMB',e.target.value)}
                                                        className={`w-full text-center outline-none bg-transparent text-[10px] ${isRec?'text-slate-300 cursor-not-allowed':'text-slate-600'}`}
                                                    />
                                                </td>
                                                <td className="border border-slate-100 p-0">
                                                    <input
                                                        type="text" value={r.dateTWD} placeholder="5/1"
                                                        readOnly={isRec}
                                                        onChange={(e)=>handleCellChange(idx,'dateTWD',e.target.value)}
                                                        className={`w-full text-center outline-none bg-transparent text-[10px] ${isRec?'text-slate-300 cursor-not-allowed':'text-slate-600'}`}
                                                    />
                                                </td>
                                                <td className="border border-slate-100 p-0 bg-blue-50/10">
                                                    <input 
                                                        type="number" value={r.purchaseRMB} placeholder="0" 
                                                        readOnly={isRec}
                                                        onChange={(e)=>handleCellChange(idx,'purchaseRMB',e.target.value)} 
                                                        className={`w-full text-center outline-none font-black bg-transparent ${isRec?'text-slate-300 cursor-not-allowed':'text-blue-900'}`} 
                                                    />
                                                </td>
                                                
                                                <td className={`${cellCls} font-mono font-bold`}>{r.hasData ? Math.round(r.reqTWD).toLocaleString() : ''}</td>
                                                <td className={`${cellCls} font-mono text-blue-500 font-bold`}>{r.hasData ? Math.round(r.principal).toLocaleString() : ''}</td>
                                                <td className={`${cellCls} font-mono font-bold text-red-500`}>{r.hasData ? Math.round(r.balance).toLocaleString() : ''}</td>
                                                <td className={cellCls}>
                                                    <button onClick={() => handleDeleteRowRequest(idx)} className="text-slate-200 hover:text-red-400 p-1">
                                                        <svg className="w-3.5 h-3.5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="flex-none bg-slate-50 p-1.5 flex justify-center gap-6 border-t border-slate-100 shadow-inner">
                            <button onClick={handleClearAllRequest} className="text-[10px] text-red-400 font-bold px-3 py-1.5 border border-red-100 rounded-full bg-white active:bg-red-50">重置表格</button>
                            <button onClick={handleAddRows} className="text-[10px] text-blue-600 font-bold px-4 py-1.5 border border-blue-100 rounded-full bg-blue-50 active:bg-blue-100">+ 5 期</button>
                        </div>
                    </div>

                    {/* 彈窗部分保持不變 */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-xl p-6 w-[260px] text-center shadow-2xl border border-slate-200">
                                <h3 className="font-bold mb-4 text-sm text-slate-800">管理者密碼</h3>
                                <input type="password" inputMode="numeric" value={pinInput} onChange={(e)=>setPinInput(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&handleAuthSubmit()} className={`w-full border-2 rounded p-2 text-center text-xl tracking-widest outline-none mb-4 ${authError?'border-red-400 bg-red-50':'border-blue-500'}`} autoFocus />
                                {authError && <p className="text-[10px] text-red-500 mb-2 font-bold">密碼錯誤，請重試！</p>}
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowAuthModal(false);setPinInput('');setAuthError(false);}} className="flex-1 py-1.5 bg-slate-100 rounded text-xs">取消</button>
                                    <button onClick={handleAuthSubmit} className="flex-1 py-1.5 bg-blue-600 text-white rounded text-xs font-bold">解鎖</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditDebtModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-xl p-6 w-[280px] text-center shadow-2xl border border-slate-200">
                                <h3 className="font-bold mb-4 text-sm text-slate-800">編輯欠款金額</h3>
                                <input type="number" value={editDebtInput} onChange={(e)=>setEditDebtInput(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&executeEditDebt()} className="w-full border-2 border-blue-500 rounded p-2 text-center text-lg outline-none mb-4" autoFocus />
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowEditDebtModal(false);setEditDebtInput('');}} className="flex-1 py-1.5 bg-slate-100 rounded text-xs">取消</button>
                                    <button onClick={executeEditDebt} className="flex-1 py-1.5 bg-blue-600 text-white rounded text-xs font-bold">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {(showConfirmModal || showDeleteRowModal) && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40">
                            <div className="bg-white rounded-lg p-5 w-[240px] text-center shadow-xl">
                                <p className="font-bold mb-5 text-xs text-slate-700">{showConfirmModal?'確定要清空所有紀錄嗎？':'確定要刪除這筆紀錄嗎？'}</p>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowConfirmModal(false);setShowDeleteRowModal(false);}} className="flex-1 py-1.5 bg-slate-100 text-[10px] rounded">取消</button>
                                    <button onClick={showConfirmModal?executeClearAll:executeDeleteRow} className="flex-1 py-1.5 bg-red-600 text-white text-[10px] rounded font-bold">確定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
