<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態支付寶代付與還款記帳系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        function App() {
            // 基本設定狀態
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('repayment_settings');
                return saved ? JSON.parse(saved) : { initialDebt: 600000, rateOrig: 4.7, ratePay: 5.0 };
            });

            // 交易紀錄狀態
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('repayment_records');
                return saved ? JSON.parse(saved) : [];
            });

            const [newPurchaseRMB, setNewPurchaseRMB] = useState('');

            // 自動儲存到瀏覽器
            useEffect(() => {
                localStorage.setItem('repayment_settings', JSON.stringify(settings));
                localStorage.setItem('repayment_records', JSON.stringify(records));
            }, [settings, records]);

            const margin = (settings.ratePay - settings.rateOrig).toFixed(2);

            // 新增一筆紀錄
            const addRecord = (e) => {
                e.preventDefault();
                if (!newPurchaseRMB || newPurchaseRMB <= 0) return;
                
                const purchase = Number(newPurchaseRMB);
                const prevDebt = records.length > 0 ? records[records.length - 1].remainingDebt : settings.initialDebt;
                const principalPaid = purchase * margin;
                const newDebt = Math.max(0, prevDebt - principalPaid);

                const newRecord = {
                    id: Date.now(),
                    batch: records.length + 1,
                    purchaseRMB: purchase,
                    requiredTWD: purchase * settings.ratePay,
                    principalPaid: principalPaid,
                    remainingDebt: newDebt
                };

                setRecords([...records, newRecord]);
                setNewPurchaseRMB('');
            };

            // 刪除最後一筆
            const undoLast = () => {
                setRecords(records.slice(0, -1));
            };

            // 重新計算（清空紀錄）
            const resetAll = () => {
                if(window.confirm('確定要清空所有交易紀錄嗎？')) {
                    setRecords([]);
                }
            };

            // 圖表資料處理
            const chartData = [
                { batch: '初始', debt: settings.initialDebt },
                ...records.map(r => ({ batch: `第 ${r.batch} 次`, debt: r.remainingDebt }))
            ];

            const currentDebt = records.length > 0 ? records[records.length - 1].remainingDebt : settings.initialDebt;
            const totalRepaid = settings.initialDebt - currentDebt;

            return (
                <div className="p-4 md:p-8 max-w-5xl mx-auto font-sans">
                    <header className="mb-8 text-center">
                        <h1 className="text-3xl font-bold text-slate-800">網拍代付動態記帳本</h1>
                        <p className="text-slate-500 mt-2">記錄每一筆採購，自動換算匯率差額抵扣舊帳</p>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                        {/* 左側：設定與輸入區 */}
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold mb-4 flex items-center text-slate-700">⚙️ 基礎設定</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">初始總欠款 (TWD)</label>
                                        <input type="number" value={settings.initialDebt} onChange={(e) => setSettings({...settings, initialDebt: Number(e.target.value)})} className="w-full border rounded-lg p-2 bg-slate-50" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">原始匯率</label>
                                            <input type="number" step="0.1" value={settings.rateOrig} onChange={(e) => setSettings({...settings, rateOrig: Number(e.target.value)})} className="w-full border rounded-lg p-2 bg-slate-50" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">結算匯率</label>
                                            <input type="number" step="0.1" value={settings.ratePay} onChange={(e) => setSettings({...settings,
